kind = "web"
previewPath = "/"
title = "Quran Kareem"
version = "1.0.0"
id = "artifacts/quran-kareem"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20162

[services.development]
run = "pnpm --filter @workspace/quran-kareem run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quran-kareem", "run", "build" ]
publicDir = "artifacts/quran-kareem/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20162"
BASE_PATH = "/"
